# Render Blueprint for the backup relay (relay/node): reaches the servers the
# Cloudflare relay cannot (servers on Cloudflare's network: Hypixel, Jartex, Pika).
services:
  - type: web
    name: jnbot-relay
    runtime: node
    plan: free
    rootDir: relay
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        value: https://jnbot-web.pages.dev
